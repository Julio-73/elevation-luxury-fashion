# ============================================================
#  ÉLÉVATION — Despliegue automático en GitHub Pages
#  Sitio estático (HTML + CSS + JS), sin paso de build.
# ============================================================
name: Deploy to GitHub Pages

on:
  # Se despliega en cada push a main
  push:
    branches: [main]
  # Permite lanzarlo a mano desde la pestaña "Actions"
  workflow_dispatch:

# Permisos mínimos necesarios para publicar en Pages
permissions:
  contents: read
  pages: write
  id-token: write

# Un solo despliegue a la vez; no cancela el que esté en curso
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    name: Publicar el sitio
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Descargar el repositorio
        uses: actions/checkout@v4

      - name: Configurar GitHub Pages
        uses: actions/configure-pages@v5
        with:
          # Crea el sitio de Pages automáticamente si aún no existe
          enablement: true

      - name: Preparar el artefacto (solo los archivos del sitio)
        run: |
          mkdir -p _site
          cp -R index.html css js _site/
          # Evita el procesado con Jekyll si algún día se sirve desde una rama
          touch _site/.nojekyll
          echo "Contenido publicado:"
          find _site -type f | sort

      - name: Subir el artefacto
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

      - name: Desplegar en GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
